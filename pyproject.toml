[project]
name = "xtts-original-streaming"
version = "0.1.0"
description = "FastAPI XTTS streaming inference server with custom checkpoint and speaker profile support."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "TTS @ git+https://github.com/coqui-ai/TTS@fa28f99f1508b5b5366539b2149963edcb80ba62",
    "transformers==4.41.2",
    "spacy==3.8.11",
    "click==8.3.1",
    "typer==0.24.1",
    "uvicorn[standard]==0.23.2",
    "fastapi>=0.110,<0.116",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart==0.0.6",
    "typing-extensions>=4.14.0",
    "numpy==1.24.3",
    "cutlet",
    "num2words",
    "PyArabic",
    "mecab-python3==1.0.6",
    "unidic-lite==1.0.8",
    "unidic==1.1.0",
    "soundfile>=0.13,<1",
]

[project.optional-dependencies]
demo = [
    "gradio",
    "requests",
]
test = [
    "requests",
]

[tool.uv]
package = false
